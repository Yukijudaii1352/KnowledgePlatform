page_icon: 🎵
page_title: 音乐生成技术演进
page_subtitle: '{build_date} 版'
page_desc: 从WaveNet的原始波形合成到MusicLM的文本驱动生成，再到SongBloom的端到端歌曲创作，AI音乐生成经历了从局部采样到长时结构一致性的技术跨越，实现了旋律、和声、人声与伴奏的全栈智能创作。
hero_pills: 🏷️ Music Generation · Audio Synthesis · Text-to-Music · Singing Voice Synthesis
count_pill: '{count} 个算法'
categories:
  early_neural:
    label: 早期神经网络
    color: '#3B82F6'
  symbolic:
    label: 符号音乐生成
    color: '#10B981'
  audio_lm:
    label: 音频语言模型
    color: '#8B5CF6'
  diffusion:
    label: 扩散模型
    color: '#F59E0B'
  end_to_end:
    label: 端到端歌曲生成
    color: '#EF4444'
  svs:
    label: 歌唱合成
    color: '#06B6D4'
algorithms:
- id: wavenet
  name: WaveNet
  full_name: 波网 (WaveNet)
  year: '2016.09'
  org: Google DeepMind
  paper_url: https://arxiv.org/abs/1609.03499
  category: early_neural
  parent: —
  motivation: 扩张因果卷积实现原始音频波形的自回归生成
- id: samplernn
  name: SampleRNN
  full_name: 采样循环网络 (SampleRNN)
  year: '2017.02'
  org: MILA
  paper_url: https://openreview.net/forum?id=Skx9Pbsge
  category: early_neural
  parent: wavenet
  motivation: 分层RNN结构优化长序列音频生成的内存效率
- id: nsynth
  name: NSynth
  full_name: 神经音色合成 (NSynth)
  year: '2017'
  org: Google Magenta
  paper_url: https://arxiv.org/abs/1704.01279
  category: early_neural
  parent: wavenet
  motivation: WaveNet自编码器学习乐器音色的潜在表示
- id: gansynth
  name: GANSynth
  full_name: 对抗音频合成 (GANSynth)
