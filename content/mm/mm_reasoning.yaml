domain: mm
topic_id: mm_reasoning
topic_name: 多模态推理
page_icon: 🧠
page_title: 多模态推理技术演进图谱
page_subtitle: '{build_date} 版'
page_desc: 涵盖从视觉问答、多模态CoT到2026年原生多模态长链推理（Think with Images）的技术发展历程
hero_pills:
- 🏷️ Multimodal CoT · Visual Reasoning · Think with Images
count_pill: '{count} 个算法'
categories:
- id: foundation
  name: 视觉语言对齐基础
  desc: 早期视觉语言对齐与VQA奠基工作，建立视觉特征与语言空间的桥接范式
- id: mm_cot
  name: 多模态思维链
  desc: 通过生成中间推理步骤提升复杂视觉问答的准确性和可解释性
- id: compositional
  name: 组合推理与神经符号
  desc: 通过程序合成和模块调用实现无需训练的灵活推理能力
- id: frontier_2026
  name: 2026前沿技术
  desc: Think with Images视觉思考范式与强化学习增强推理的最新突破
