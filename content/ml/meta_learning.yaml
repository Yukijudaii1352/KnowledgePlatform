graph:
  nodes:
    # — 基于度量 (y ≈ 60-100) —
    - { id: siamese,      x: 100, y: 60,  category: metric }
    - { id: matching_net,  x: 200, y: 60,  category: metric }
    - { id: proto_net,     x: 340, y: 60,  category: metric }
    - { id: relation_net,  x: 480, y: 40,  category: metric }
    - { id: tadam,         x: 480, y: 90,  category: metric }
    # — 基于优化 (y ≈ 180-260) —
    - { id: l2l,           x: 200, y: 200, category: optimization }
    - { id: maml,          x: 340, y: 200, category: optimization }
    - { id: meta_sgd,      x: 480, y: 170, category: optimization }
    - { id: reptile,       x: 480, y: 230, category: optimization }
    - { id: leo,           x: 580, y: 170, category: optimization }
    - { id: anil,          x: 650, y: 230, category: optimization }
    # — 基于模型/记忆 (y ≈ 330-370) —
    - { id: mann,          x: 200, y: 350, category: model_based }
    - { id: meta_net,      x: 340, y: 330, category: model_based }
    - { id: snail,         x: 480, y: 350, category: model_based }
    # — 2026前沿 (y ≈ varied) —
    - { id: binomial_ml,   x: 800, y: 170, category: frontier }
    - { id: ttt_discover,  x: 800, y: 230, category: frontier }
    - { id: mass,          x: 850, y: 280, category: frontier }
    - { id: fspo,          x: 850, y: 100, category: frontier }

  edges:
    # 度量演化线
    - { from: siamese,      to: matching_net, label: "引入情节训练" }
    - { from: matching_net,  to: proto_net,    label: "原型简化度量" }
    - { from: proto_net,     to: relation_net, label: "学习非线性距离" }
    - { from: proto_net,     to: tadam,        label: "任务感知缩放" }
    # 优化演化线
    - { from: l2l,           to: maml,         label: "优化初始化点" }
    - { from: maml,          to: meta_sgd,     label: "可学习学习率" }
    - { from: maml,          to: reptile,      label: "一阶近似降开销" }
    - { from: maml,          to: leo,          label: "潜空间适应" }
    - { from: maml,          to: anil,         label: "验证特征复用" }
    # 模型演化线
    - { from: mann,          to: meta_net,     label: "快慢权重分离" }
    - { from: mann,          to: snail,        label: "卷积+注意力" }
    # 2026前沿演化线
    - { from: maml,          to: binomial_ml,  label: "平滑梯度流" }
    - { from: reptile,       to: ttt_discover, label: "测试时权重更新" }
    - { from: maml,          to: mass,         label: "自合成课程" }
    - { from: anil,          to: fspo,         label: "偏好元学习" }

  milestones: [matching_net, maml, proto_net]
