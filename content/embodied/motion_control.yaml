  name: WB-MPC
  full_name: 全身模型预测控制 (Whole-Body MPC)
  year: '2022'
  org: LAAS-CNRS
  paper_url: https://ieeexplore.ieee.org/abstract/document/10000129
  category: mpc
  parent: convex_mpc
  motivation: 全身动力学MPC控制人形机器人
