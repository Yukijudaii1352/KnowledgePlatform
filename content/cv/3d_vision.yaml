  name: Deocc-1-to-3
  full_name: 单图3D去遮挡 (Deocc-1-to-3)
  year: '2026'
  org: AAAI
  paper_url: https://ojs.aaai.org/index.php/AAAI/article/view/37820
  category: reconstruction
  parent: neus
  motivation: 自监督多视角扩散模型11秒完成遮挡图像3D重建
