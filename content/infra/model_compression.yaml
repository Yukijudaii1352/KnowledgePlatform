domain: infra
topic_id: model_compression
topic_name: 模型压缩
page_icon: 🗜️
page_title: 模型压缩算法总结
page_subtitle: '{build_date} 版'
page_desc: 综述量化、剪枝、蒸馏与稀疏化部署的技术演进，涵盖从经典压缩范式到2026年最新前沿进展。
