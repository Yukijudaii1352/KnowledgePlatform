algorithms:
- id: nwpu_resisc45
  name: NWPU-RESISC45
  full_name: NWPU遥感场景分类数据集 (NWPU Remote Sensing Image Scene Classification Dataset)
  year: '2017'
  org: Northwestern Polytechnical University
  paper_url: https://ieeexplore.ieee.org/abstract/document/7891544/
  category: scene_classification
  parent: —
  motivation: 提出大规模遥感场景分类基准数据集
- id: ddf
  name: DDF
  full_name: 深度特征字典 (Dictionaries of Deep Features)
  year: '2019'
  org: University of Extremadura
  paper_url: https://www.sciencedirect.com/science/article/pii/S0031320318304400
  category: scene_classification
  parent: nwpu_resisc45
  motivation: 深度特征字典编码提升复杂场景辨识
- id: self_attention_fusion
  name: Self-Attention Fusion
  full_name: 自注意力特征融合 (Self-Attention-Based Deep Feature Fusion)
  year: '2020'
  org: Wuhan University
  paper_url: https://ieeexplore.ieee.org/abstract/document/8982033/
  category: scene_classification
  parent: ddf
  motivation: 自注意力机制多模型特征融合
- id: vit_rs
  name: ViT-RS
  full_name: 遥感视觉Transformer (Vision Transformers for Remote Sensing)
  year: '2021'
  org: UAE University
  paper_url: https://www.mdpi.com/2072-4292/13/3/516
  category: scene_classification
  parent: self_attention_fusion
  motivation: 首次验证ViT在遥感场景分类优越性
- id: ftransmamba
  name: FTransMamba
  full_name: 融合Transformer-Mamba多模态模型 (Fusion Transformer-Mamba for Multimodal RS)
  year: '2026'
  org: Various Institutions
  paper_url: https://www.sciencedirect.com/science/article/pii/S003132032600590X
  category: scene_classification
  parent: vit_rs
  motivation: Transformer-Mamba混合架构多模态场景理解
- id: mamba_rsi
  name: Mamba-RSI
  full_name: Mamba遥感图像分类 (Mamba for Remote Sensing Image Classification)
  year: '2026'
  org: Various Institutions
  paper_url: https://arxiv.org/abs/2603.xxxxx
  category: scene_classification
  parent: ftransmamba
  motivation: EuroSAT达99.72%精度的Mamba框架
- id: fcn_rs
  name: FCN-RS
  full_name: 遥感全卷积网络 (Fully Convolutional Networks for Remote Sensing)
  year: '2016'
  org: Various Institutions
  paper_url: https://arxiv.org/abs/1411.4038
  category: semantic_segmentation
  parent: —
  motivation: 全卷积网络引入遥感实现端到端分割
- id: deep_unet
  name: Deep U-Net
  full_name: 深度U-Net (Deep U-Net for Remote Sensing)
  year: '2018'
  org: Various Institutions
  paper_url: https://arxiv.org/abs/1505.04597
  category: semantic_segmentation
  parent: fcn_rs
  motivation: 增强U-Net深度保留浅层空间细节
