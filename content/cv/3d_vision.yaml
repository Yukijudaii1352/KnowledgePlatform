  full_name: 神经隐式表面 (NeuS)
  year: '2021'
  org: Zhejiang Univ
  paper_url: https://arxiv.org/abs/2106.10689
  category: reconstruction
  parent: deepsdf
  motivation: 无偏体渲染+SDF实现高精度表面提取
- id: volsdf
  name: VolSDF
  full_name: 体密度SDF (VolSDF)
