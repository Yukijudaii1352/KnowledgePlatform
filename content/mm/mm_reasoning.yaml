  name: ViLBERT
  full_name: 视觉语言BERT (Vision-and-Language BERT)
  year: '2019'
  org: Georgia Tech / Meta
  paper_url: https://proceedings.neurips.cc/paper/2019/hash/c74d97b59837b67032d2d4d6208c1d39-Abstract.html
