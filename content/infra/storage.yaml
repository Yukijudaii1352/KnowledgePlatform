  paper_url: https://arxiv.org/abs/2312.06254
  category: cache
  parent: cedar
  motivation: 动态数据集,端到端训练优化
- id: learned_index
  name: Learned Index
  full_name: 学习索引 (Learned Index)
  year: '2018'
  org: Google
  paper_url: https://dl.acm.org/doi/10.1145/3183713.3196909
  category: emerging
  parent: —
