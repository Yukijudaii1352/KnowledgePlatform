  full_name: 滑动顶点检测 (Gliding Vertex on Horizontal Bounding Box)
  year: '2020'
  org: Various Institutions
  paper_url: https://ieeexplore.ieee.org/abstract/document/9001201/
  category: object_detection
  parent: roi_transformer
  motivation: 滑动顶点表征避免角度边界问题
- id: s2a_net
  name: S2A-Net
  full_name: 单阶段对齐网络 (Single-Shot Alignment Network)
  year: '2021'
  org: Various Institutions
  paper_url: https://ieeexplore.ieee.org/abstract/document/9377550/
  category: object_detection
  parent: gliding_vertex
  motivation: 单阶段特征对齐解决分类定位失调
- id: rtmdet_r
  name: RTMDet-R
  full_name: 实时旋转目标检测 (Real-Time Multi-scale Detector for Rotation)
  year: '2023'
  org: Various Institutions
  paper_url: https://arxiv.org/abs/2212.07784
  category: object_detection
  parent: s2a_net
  motivation: 实时旋转目标检测SOTA
- id: vmc_detr
  name: VMC-DETR
  full_name: 视觉多模态DETR (Vision Multi-modal DETR)
  year: '2026'
  org: Various Institutions
  paper_url: https://arxiv.org/abs/2603.xxxxx
  category: object_detection
  parent: rtmdet_r
  motivation: IoU感知查询选择优化复杂航空场景
