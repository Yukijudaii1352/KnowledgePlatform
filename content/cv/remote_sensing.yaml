  name: HRCNet
  full_name: 高分辨率上下文提取网络 (High-Resolution Context Extraction Network)
  year: '2020'
  org: Various Institutions
  paper_url: https://www.mdpi.com/2072-4292/13/1/71
  category: semantic_segmentation
  parent: deep_unet
  motivation: 全程保持高分辨率表征减少空间损失
- id: deeplabv3_rs
  name: DeepLabV3+-RS
  full_name: 遥感DeepLabV3+ (DeepLabV3+ for Remote Sensing)
  year: '2021'
  org: Various Institutions
  paper_url: https://ieeexplore.ieee.org/abstract/document/10608051/
  category: semantic_segmentation
  parent: hrcnet
  motivation: ASPP空洞卷积捕获多尺度地物特征
- id: segformer_rs
  name: SegFormer-RS
  full_name: 遥感SegFormer (SegFormer for Remote Sensing)
  year: '2021'
  org: Various Institutions
  paper_url: https://arxiv.org/abs/2105.15203
  category: semantic_segmentation
  parent: deeplabv3_rs
  motivation: Transformer语义分割应用于遥感
- id: sam2_cd
  name: SAM2-CD
  full_name: SAM2变化检测适配 (SAM2 for Change Detection)
  year: '2026'
  org: Various Institutions
  paper_url: https://www.researchgate.net/publication/389465432
  category: semantic_segmentation
  parent: segformer_rs
  motivation: SAM2适配多时相变化检测达85.51%IoU
- id: rs2_sam2
  name: RS2-SAM2
  full_name: 指代性遥感分割SAM2 (Referring Remote Sensing Segmentation with SAM2)
  year: '2026'
  org: Various Institutions
  paper_url: https://arxiv.org/abs/2603.xxxxx
  category: semantic_segmentation
  parent: sam2_cd
  motivation: AAAI2026指代性遥感分割框架
- id: terramind
  name: TerraMind
  full_name: 地球智能基础模型 (TerraMind Foundation Model)
  year: '2026'
  org: IBM & ESA
  paper_url: https://arxiv.org/abs/2603.00988
  category: semantic_segmentation
  parent: —
  motivation: 9模态5.24亿瓦片开源地理空间基础模型
- id: fc_siam
  name: FC-Siam
  full_name: 全卷积孪生网络 (Fully Convolutional Siamese Networks)
  year: '2018'
  org: ONERA
  paper_url: https://arxiv.org/abs/1810.08462
  category: change_detection
  parent: —
  motivation: 全卷积孪生网络奠定深度变化检测基础
- id: dasnet
  name: DASNet
  full_name: 双注意力孪生网络 (Dual Attentive Siamese Network)
  year: '2020'
  org: Wuhan University
  paper_url: https://ieeexplore.ieee.org/abstract/document/9259045/
  category: change_detection
  parent: fc_siam
  motivation: 双注意力度量学习增强未变化区域抑制
- id: stanet
  name: STANet
  full_name: 时空注意力网络 (Spatial-Temporal Attention Network)
  year: '2020'
  org: Various Institutions
  paper_url: https://arxiv.org/abs/2001.01293
  category: change_detection
  parent: dasnet
  motivation: 时空注意力机制解决配准误差问题
- id: bit
  name: BIT
  full_name: 双时相图像Transformer (Bi-temporal Image Transformer)
  year: '2021'
  org: Beihang University
  paper_url: https://ieeexplore.ieee.org/abstract/document/9491802/
  category: change_detection
  parent: stanet
  motivation: Transformer在特征域建模双时相上下文
- id: changeformer
  name: ChangeFormer
  full_name: 变化检测Transformer (Transformer for Change Detection)
  year: '2022'
  org: Various Institutions
  paper_url: https://arxiv.org/abs/2201.01293
  category: change_detection
  parent: bit
  motivation: 纯Transformer端到端变化检测
- id: changemamba
  name: ChangeMamba
  full_name: 变化检测Mamba (Mamba for Change Detection)
  year: '2024'
  org: Various Institutions
  paper_url: https://ieeexplore.ieee.org/abstract/document/10565926/
  category: change_detection
  parent: changeformer
  motivation: 状态空间模型处理时空序列变化检测
- id: glmamba
  name: GLMamba
  full_name: 全局-局部Mamba (Global-Local Mamba Network)
  year: '2026'
  org: Various Institutions
  paper_url: https://ieeexplore.ieee.org/abstract/document/11442939/
  category: change_detection
  parent: changemamba
  motivation: 全局-局部Mamba平衡建模与细节能力
- id: armamba
  name: ARMamba
  full_name: 自适应残差Mamba (Adaptive Residual Mamba)
  year: '2026'
  org: Various Institutions
  paper_url: https://ieeexplore.ieee.org/abstract/document/11501189/
  category: change_detection
  parent: glmamba
  motivation: 自适应残差Mamba解决长程依赖问题
- id: mamba_fcs
  name: Mamba-FCS
  full_name: 频率-时空Mamba (Frequency-Spatial-Temporal Mamba)
  year: '2026'
  org: Various Institutions
  paper_url: https://ieeexplore.ieee.org/abstract/document/11391528/
  category: change_detection
  parent: changemamba
  motivation: 时空频率融合语义变化检测
- id: r2cnn
  name: R2CNN
  full_name: 旋转区域卷积网络 (Rotational Region CNN)
  year: '2017'
  org: Various Institutions
  paper_url: https://arxiv.org/abs/1706.09579
  category: object_detection
  parent: —
  motivation: Faster R-CNN增加旋转分支支持多角度检测
- id: roi_transformer
  name: RoI Transformer
  full_name: RoI变换器 (RoI Transformer for Oriented Object Detection)
  year: '2019'
  org: Various Institutions
  paper_url: http://openaccess.thecvf.com/content_CVPR_2019/html/Ding_Learning_RoI_Transformer_for_Oriented_Object_Detection_in_Aerial_Images_CVPR_2019_paper.html
