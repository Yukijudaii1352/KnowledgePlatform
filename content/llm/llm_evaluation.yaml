page_meta:
  domain: llm
  topic_id: llm_evaluation
  topic_name: LLM评测
  page_icon: 📊
  page_title: LLM评测 算法总结
  page_subtitle: '{build_date} 版'
  page_desc: 从基础基准到自动化评测，系统梳理LLM评测技术从通用能力、专业能力到对齐安全的完整演进脉络，涵盖2026年Agent评测、长上下文评测等前沿动态。
  hero_pills: 知识·推理·代码·Agent·对齐
  count_pill: '{count} 个算法'
categories:
  general:
    name: 通用能力评测
    color: '#22a06b'
    desc: 评估LLM的知识理解、常识推理、数学推理和代码生成等基础能力
  specialized:
    name: 专业能力评测
    color: '#1f77b4'
    desc: 针对医学、法律、金融、科学等垂直领域的专业知识与推理能力评测
  alignment:
    name: 对齐与安全评测
    color: '#d62728'
    desc: 评估模型的真实性、安全性、偏见控制及对人类价值观的对齐程度
  frontier_2026:
    name: 2026年前沿
    color: '#9467bd'
    desc: 高难度基准、自动化评测、Agent能力、长上下文及动态评测等前沿方向
algorithms:
- id: mmlu
  name: MMLU
  full_name: 大规模多任务语言理解 (Massive Multitask Language Understanding)
