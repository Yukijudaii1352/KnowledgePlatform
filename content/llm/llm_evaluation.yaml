  paper_url: https://arxiv.org/abs/2305.08322
  category: general
  parent: mmlu
  motivation: 中文学术能力4级难度分层评测
- id: cmmlu
  name: CMMLU
  full_name: 中文大规模多任务语言理解 (Chinese MMLU)
