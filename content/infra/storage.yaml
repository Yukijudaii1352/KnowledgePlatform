  paper_url: https://nvmexpress.org/developers/nvme-of-specification/
  category: emerging
  parent: —
  motivation: RDMA/TCP远程NVMe,DPU卸载
- id: cxl
  name: CXL Memory
  full_name: CXL内存扩展 (Compute Express Link)
