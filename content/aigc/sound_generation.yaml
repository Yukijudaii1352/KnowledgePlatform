page_icon: 🔊
page_title: AI音频生成技术演化图谱
page_subtitle: 2026-05-12 版
page_desc: 从WaveNet自回归波形生成到Diffusion Transformer统一框架，AI音频生成经历了自回归时代、GAN时代、扩散模型时代和统一大模型时代四个阶段，涵盖TTS、语音克隆、音效生成、神经编解码器与音乐生成五大技术方向。
hero_pills:
- 文本到语音
- 语音克隆
- 音效生成
- 神经编解码器
- 音乐生成
- Diffusion Transformer
- 零样本克隆
- 实时推理
