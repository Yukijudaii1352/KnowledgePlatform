page_meta:
  page_icon: 🎬
  page_title: 视频生成 算法总结
  page_subtitle: '{build_date} 版'
  page_desc: 从GAN到扩散模型再到世界模型的视频生成技术演进，涵盖Sora、Kling等里程碑模型与时序一致性核心技术
  hero_pills: Sora · Kling · 时序一致性
  count_pill: '{count} 个算法'
categories:
  gan_based:
    label: GAN生成模型
    color: '#E74C3C'
  vae_based:
    label: VAE变分编码
    color: '#9B59B6'
  autoregressive:
    label: 自回归模型
    color: '#3498DB'
  diffusion_based:
    label: 扩散模型
    color: '#2ECC71'
  world_model:
    label: 世界模型
    color: '#F39C12'
algorithms:
- id: videogan
  name: VideoGAN
  full_name: 视频生成对抗网络 (Video Generative Adversarial Network)
  year: '2016'
  org: MIT
  paper_url: https://arxiv.org/abs/1609.02612
  category: gan_based
  parent: —
  motivation: 首次将GAN应用于视频生成，分解静态背景与动态前景
- id: mocogan
  name: MoCoGAN
  full_name: 运动内容解耦GAN (Motion-Content Decomposed GAN)
  year: '2018'
  org: NEC Labs
  paper_url: https://arxiv.org/abs/1707.04993
  category: gan_based
  parent: videogan
  motivation: 将潜在空间分解为内容和运动部分，实现解耦控制
- id: tgan
  name: TGAN
  full_name: 时序生成对抗网络 (Temporal GAN)
  year: '2017'
  org: Preferred Networks
  paper_url: https://arxiv.org/abs/1611.06624
  category: gan_based
  parent: videogan
  motivation: 引入时序判别器增强视频时序连贯性
- id: svg
  name: SVG
  full_name: 随机视频生成 (Stochastic Video Generation)
  year: '2018'
  org: DeepMind
  paper_url: https://arxiv.org/abs/1802.07687
  category: vae_based
  parent: —
  motivation: 引入随机隐变量建模视频生成的不确定性
- id: videogpt
  name: VideoGPT
  full_name: 视频生成预训练Transformer (Video Generative Pre-trained Transformer)
  year: '2021'
  org: UC Berkeley
  paper_url: https://arxiv.org/abs/2104.10157
  category: autoregressive
  parent: svg
  motivation: 将视频视为离散Token序列进行自回归预测
- id: nuwa
  name: NUWA
  full_name: 女娲多模态生成模型 (NUWA)
  year: '2021.11'
  org: Microsoft Research Asia
  paper_url: https://arxiv.org/abs/2111.12417
  category: autoregressive
  parent: videogpt
  motivation: 统一文本、图像、视频生成的多任务框架
- id: nuwa_infinity
  name: NUWA-Infinity
  full_name: 女娲无限生成模型 (NUWA-Infinity)
  year: '2022.07'
  org: Microsoft Research Asia
  paper_url: https://arxiv.org/abs/2207.09814
  category: autoregressive
  parent: nuwa
  motivation: 自回归之上的自回归，突破固定分辨率和长度限制
- id: cogvideo
  name: CogVideo
  full_name: 认知视频生成模型 (CogVideo)
  year: '2022.05'
  org: 清华大学/智谱AI
  paper_url: https://arxiv.org/abs/2205.15868
  category: autoregressive
  parent: nuwa
  motivation: 多帧速率层级训练，实现高质量文本到视频生成
- id: svd
  name: SVD
  full_name: 稳定视频扩散 (Stable Video Diffusion)
  year: '2023.11'
  org: Stability AI
  paper_url: https://arxiv.org/abs/2311.15127
  category: diffusion_based
  parent: —
  motivation: 开源基线，三阶段训练，时序感知去闪烁解码器
- id: sora
  name: Sora
  full_name: Sora视频生成模型 (Sora)
  year: '2024.02'
  org: OpenAI
  paper_url: https://openai.com/index/video-generation-models-as-world-simulators/
  category: diffusion_based
  parent: svd
  motivation: 时空补丁DiT架构，初步物理模拟能力
- id: sora2
  name: Sora 2
  full_name: Sora第二代 (Sora 2)
  year: '2024.12'
  org: OpenAI
  paper_url: https://openai.com/sora
  category: diffusion_based
  parent: sora
  motivation: 1080p/60s生成，API转型，物理模拟增强
- id: gen1
  name: Gen-1
  full_name: Runway Gen-1 (Runway Gen-1)
  year: '2023.02'
  org: Runway
  paper_url: https://research.runwayml.com/gen1
  category: diffusion_based
  parent: svd
  motivation: 视频到视频转换，风格迁移保持结构
- id: gen2
  name: Gen-2
  full_name: Runway Gen-2 (Runway Gen-2)
  year: '2023.06'
  org: Runway
  paper_url: https://research.runwayml.com/gen2
  category: diffusion_based
  parent: gen1
  motivation: 首次文本到视频和图像到视频能力
- id: gen3
  name: Gen-3 Alpha
  full_name: Runway Gen-3 Alpha (Runway Gen-3 Alpha)
  year: '2024.06'
  org: Runway
  paper_url: https://runwayml.com/research/introducing-gen-3-alpha
  category: diffusion_based
  parent: gen2
  motivation: 时空世界模型，全局物理一致性建模
- id: gen4
  name: Gen-4
  full_name: Runway Gen-4 (Runway Gen-4)
  year: '2026.01'
  org: Runway
  paper_url: https://runwayml.com/gen-4
  category: diffusion_based
  parent: gen3
  motivation: 世界一致性，角色身份跨场景持久性
- id: pika
  name: Pika
  full_name: Pika视频生成 (Pika)
  year: '2023.04'
  org: Pika Labs
  paper_url: https://pika.art
  category: diffusion_based
  parent: svd
  motivation: Pikaffects物理特效，电影级镜头控制
- id: pika25
  name: Pika 2.5
  full_name: Pika 2.5 (Pika 2.5)
  year: '2025.11'
  org: Pika Labs
  paper_url: https://pika.art/blog/pika-2-5
  category: diffusion_based
  parent: pika
  motivation: 实时唇形同步，自动音效生成
- id: lumiere
  name: Lumiere
  full_name: 光影视频生成 (Lumiere)
  year: '2024.01'
  org: Google Research
  paper_url: https://arxiv.org/abs/2401.12945
  category: diffusion_based
  parent: svd
  motivation: 时空U-Net单次生成完整时长，全局运动一致性
- id: cogvideox
  name: CogVideoX
  full_name: 认知视频X (CogVideoX)
  year: '2024.08'
  org: 智谱AI
  paper_url: https://arxiv.org/abs/2408.06072
  category: diffusion_based
  parent: cogvideo
  motivation: 3D因果VAE，Expert Transformer架构
- id: veo
  name: Veo
  full_name: Veo视频生成 (Veo)
  year: '2024.05'
  org: Google DeepMind
  paper_url: https://deepmind.google/technologies/veo/
  category: diffusion_based
  parent: lumiere
  motivation: 高分辨率生成，增强可控性
- id: veo3
  name: Veo 3.1
  full_name: Veo 3.1 (Veo 3.1)
  year: '2026.01'
  org: Google DeepMind
  paper_url: https://blog.google/technology/ai/google-veo-3-update/
  category: diffusion_based
  parent: veo
  motivation: 原生4K/60fps音视频同步，Cinematic Anchor
- id: hunyuanvideo
  name: HunyuanVideo
  full_name: 混元视频 (HunyuanVideo)
  year: '2024.12'
  org: 腾讯
  paper_url: https://github.com/Tencent/HunyuanVideo
  category: diffusion_based
  parent: svd
  motivation: 开源SSTA-DiT架构，8.3B参数
- id: hunyuanvideo15
  name: HunyuanVideo 1.5
  full_name: 混元视频1.5 (HunyuanVideo 1.5)
  year: '2026.04'
  org: 腾讯
  paper_url: https://github.com/Tencent/HunyuanVideo
  category: diffusion_based
  parent: hunyuanvideo
  motivation: 消费级GPU优化，14GB VRAM可运行
- id: wan
  name: Wan
  full_name: 万象视频生成 (Wan)
  year: '2025.02'
  org: 阿里巴巴
  paper_url: https://wavespeed.ai
  category: diffusion_based
  parent: svd
  motivation: MoE架构，首末帧引导技术
- id: wan27
  name: Wan 2.7
  full_name: 万象2.7 (Wan 2.7)
  year: '2026.03'
  org: 阿里巴巴
  paper_url: https://wavespeed.ai/blog/wan-2-7-launch
  category: diffusion_based
  parent: wan
  motivation: 2.7B参数开源，混合专家扩展
- id: seedance
  name: Seedance
  full_name: 即梦视频生成 (Seedance)
  year: '2025.08'
  org: 字节跳动
  paper_url: https://dreamina.com
  category: diffusion_based
  parent: svd
  motivation: 时间线提示，精确时间窗口动作控制
- id: seedance2
