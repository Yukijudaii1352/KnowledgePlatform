  name: Sam 3D Body
  full_name: 动量人体骨架 (Sam 3D Body with Momentum Human Rig)
  year: '2026.02'
  org: Holographica
  paper_url: https://holographica.space/news/sam-3d-body/
  category: mesh
  parent: smplx
