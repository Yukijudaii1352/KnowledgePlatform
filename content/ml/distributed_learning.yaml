  name: Parameter Server
  full_name: 参数服务器 (Parameter Server)
  year: '2014'
  org: CMU/Baidu
  paper_url: https://www.usenix.org/conference/osdi14/technical-sessions/presentation/li_mu
  category: parameter_server
  parent: distbelief
