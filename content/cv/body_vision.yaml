  paper_url: https://arxiv.org/abs/2209.14916
  category: motion
  parent: actor
  motivation: 首个将扩散模型应用于动作生成的框架
- id: motiondiffuse
  name: MotionDiffuse
  full_name: 运动扩散 (MotionDiffuse)
  year: '2022'
  org: 商汤科技
  paper_url: https://arxiv.org/abs/2208.15001
  category: motion
  parent: actor
  motivation: 首个基于扩散模型的文本驱动动作生成
- id: t2mgpt
  name: T2M-GPT
  full_name: 动作GPT (Text-to-Motion GPT)
  year: '2023'
