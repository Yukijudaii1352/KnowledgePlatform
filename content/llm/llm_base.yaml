    name: Switch Transformer
    full_name: "稀疏专家 Transformer (Switch Transformer)"
    year: "2021.01"
    org: "Google Research"
    paper_url: "https://arxiv.org/abs/2101.03961"
    category: sparse_moe
    parent: t5
    motivation: "Top1路由简化万亿MoE"

